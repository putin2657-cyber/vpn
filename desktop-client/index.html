<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
    <title>VPN Client</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>VPN Client</h1>

      <div class="status" id="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">Not connected</span>
      </div>

      <label for="server">Server</label>
      <input id="server" type="text" placeholder="vpn.example.com:443" autocomplete="off" />

      <label for="token">Token</label>
      <input id="token" type="password" placeholder="your access token" autocomplete="off" />

      <button id="action">Connect</button>

      <p class="hint">
        Connecting asks for your macOS password: routing the whole system
        through the tunnel requires administrator rights.
      </p>

      <pre id="log" aria-live="polite"></pre>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
